<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Utopia 设置</title>
  <style>
    /* 双主题：跟随主进程 nativeTheme（主窗口页面切主题时会同步过去）。
       prefers-color-scheme 在 Electron 里由 nativeTheme.themeSource 驱动。 */
    :root { color-scheme: light dark; }
    :root { --bg:#f5f5f7; --panel:#ffffff; --line:#dedee2; --text:#141416; --muted:#585860; --accent:#0b5fbf; --danger:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f0f11; --panel:#1a1a1d; --line:#303034; --text:#ffffff; --muted:#b0b0b6; --accent:#0070e0; --danger:#ff6b6b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei",system-ui,sans-serif; font-size:13px; }
    .wrap { padding:22px; }
    h1 { font-size:18px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 18px; line-height:1.6; }
    label { display:block; color:var(--muted); margin:14px 0 6px; }
    input[type=password], input[type=text] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(0,112,224,.20); }
    .hint { color:var(--muted); font-size:12px; line-height:1.6; margin-top:6px; }
    .row { display:flex; gap:10px; margin-top:18px; }
    button { padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; font-size:13px; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button:disabled { opacity:.6; cursor:default; }
    .check { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); }
    .check input { width:auto; }
    .status { min-height:20px; margin-top:12px; color:var(--muted); }
    .status.ok { color:#16a34a; }
    @media (prefers-color-scheme: dark) { .status.ok { color:#5fe08a; } }
    .status.err { color:var(--danger); }
    .warn { border:1px solid #4b3a1f; background:#1e1a10; color:#f2cf8b; padding:10px 12px; border-radius:8px; line-height:1.6; margin-top:16px; }
    code { color:#9fd0ff; }
    @media (prefers-color-scheme: light) { code { color:#0b5fbf; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Utopia 设置</h1>
    <p class="sub">播放选项。保存后应用会自动重启。</p>

    <label class="check"><input id="allowPrivate" type="checkbox" /> 允许播放本机 / 局域网地址（AList、OpenList 等自建服务）</label>
    <div class="hint">本客户端的本地服务只监听 127.0.0.1，不对局域网暴露。关掉后，来自本机/局域网的直链（含 HLS 分片）会被拒绝，表现为「播不出来」。</div>

    <div class="row">
      <button class="primary" id="save">保存并重启</button>
      <button id="cancel">取消</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const saveEl = document.getElementById('save');

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = `status ${kind || ''}`;
    }

    async function load() {
      try {
        const data = await window.desktopSettings.load();
        document.getElementById('allowPrivate').checked = data.allowPrivateUpstream !== false;
      } catch (error) {
        setStatus(`读取配置失败：${error.message || error}`, 'err');
      }
    }

    saveEl.addEventListener('click', async () => {
      saveEl.disabled = true;
      setStatus('正在保存并重启…');
      try {
        await window.desktopSettings.save({
          allowPrivateUpstream: document.getElementById('allowPrivate').checked,
        });
      } catch (error) {
        saveEl.disabled = false;
        setStatus(`保存失败：${error.message || error}`, 'err');
      }
    });

    document.getElementById('cancel').addEventListener('click', () => window.desktopSettings.close());
    load();
  </script>
</body>
</html>
