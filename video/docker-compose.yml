services:
  utopia-web:
    build: .
    image: utopia-web:latest
    container_name: utopia-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 无状态服务：学习数据在浏览器 localStorage，无需挂载卷
    environment:
      # 可选：自建内网 IPTV 放行（对拉列表、测活、拉流三个阶段同时生效，默认关闭以维持 SSRF 防护）
      # - LIVE_ALLOW_PRIVATE=1
      # 可选：放行内网上游媒体（自建 AList / OpenList 的网盘直链常在本机或局域网）。
      # ⚠️ 只在服务不对外暴露时打开；公网部署请保持关闭，否则媒体代理会成为内网探测跳板。
      # - ALLOW_PRIVATE_UPSTREAM=1
      # 可选：代理上游请求的「等响应头」超时（毫秒，默认 15000，只管到响应头）与重试次数
      # - REQUEST_TIMEOUT=15000
      # - MAX_RETRIES=1
      # 可选：每个搜索源最多抓取的页数（1-50，默认 5），调大会显著增加上游请求量
      # - SEARCH_MAX_PAGES=5
      # 可选：单个搜索源的总死线（毫秒，3s-60s，默认 10000），到点中断该源并标记超时
      # - SEARCH_SOURCE_TIMEOUT_MS=10000
      # 可选：代理请求 UA（豆瓣防盗链等场景）
      # - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36
      # 可选：影视榜单推荐源（60s API）实例地址，官方公共实例有限流
      # - 60S_API_BASE=https://60s.crystelf.top
